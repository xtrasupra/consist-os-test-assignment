<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сортировка списка по частоте элементов</title>
    
    <link href="../style.css" rel="stylesheet">
</head>
<body>
    <a class="back-link" href="../index.html">← Все задания</a>
    <h1 id="textpechat" class="line-1 anim-textpechat">Сортировка списка по частоте элементов</h1>

    <div class="block-pages-1">
    <input type="text" id="inputList" placeholder='Введите список (через запятую)'>
    <button onclick="sortByFrequency()" class="btn-result">Отсортировать</button>
    <p class="text-result-1"><strong>Результат:</strong> <span id="output"></span></p>
</div>

    <img src="../svg/code4.svg" class="code_text_1" alt="Иллюстрация исходного решения">
    <script>

        function sortByFrequency() {
            let input = document.getElementById("inputList").value;
            
            let list = input.split(',').map(item => item.trim());

            let freqMap = new Map();
            list.forEach(item => {
                freqMap.set(item, (freqMap.get(item) || 0) + 1);
            });

            list.sort((a, b) => {
                return freqMap.get(b) - freqMap.get(a);
            });

            document.getElementById("output").textContent = JSON.stringify(list);
        }
    </script>
</body>
</html>
