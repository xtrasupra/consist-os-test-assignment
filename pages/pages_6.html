<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сортировка списка с сохранением нулей</title>
    
    <link href="../style.css" rel="stylesheet">
</head>
<body>
    <a class="back-link" href="../index.html">← Все задания</a>
    <h1 id="textpechat" class="line-1 anim-textpechat">Сортировка списка с сохранением нулей</h1>

    <div class="block-pages-1">
    <input type="text" id="inputList" placeholder="Введите числа через запятую">
    <button onclick="sortWithZeros()"  class="btn-result">Отсортировать</button>
    <p class="text-result-1"><strong>Результат:</strong> <span id="output"></span></p></div>

    <img src="../svg/code6.svg" class="code_text_1" alt="Иллюстрация исходного решения">
    <script>

        function sortWithZeros() {
            let input = document.getElementById("inputList").value;

            let list = input.split(',').map(item => parseInt(item.trim()));

            let nonZeroNumbers = list.filter(num => num !== 0).sort((a, b) => a - b);

            let sortedList = list.map(num => (num === 0 ? 0 : nonZeroNumbers.shift()));

            document.getElementById("output").textContent = JSON.stringify(sortedList);
        }
    </script>
</body>
</html>
